<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Battleships</title>
</head>
<body>
    <template id="boardTemplate">
        <table class="game-board"></table>
    </template>
    <dialog id="nextTurnOverlay">
        <div class="overlay-container">
            <button type="button" id="nextPlayersTurn">Start next players turn</button>
        </div>
    </dialog>
    <div id="mainMenu" style="display: none;">
        <form method="dialog" id="newGameForm">
            <div class="form-container">
                <h1>Battleships!</h1>
                <div class="controls-container">
                    <div class="container">
                        <div class="player-names-section">
                            <h2>Pick your names</h2>
                            <div class="player-names">
                                <div class="player-name">
                                    <label for="player1NameInput">Player 1</label>
                                    <input type="text" id="player1NameInput" placeholder="Player 1 Name..." name="player1Name" required>
                                </div>
                                <div class="vertical"></div>
                                <div class="player-name">
                                    <label for="player2NameInput">Player 2</label>
                                    <input type="text" id="player2NameInput" placeholder="Player 2 Name..." name="player2Name" required>
                                </div>
                            </div>
                        </div>
                        <div class="settings">
                            <label for="computerCheckbox">Computer Opponent</label>
                            <input type="checkbox" id="computerCheckbox">
                        </div>
                    </div>
                    <div class="buttons">
                        <button id="createNewGame" type="submit">Start Game</button>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <div id="game" style="display: none;">
        <div class="game-status-bar">
            <h2 id="currentGameStatus">Player 1 is placing</h2>
            <div class="instructions">
                <div class="water">
                    <span>Water</span>
                    <div class="icon"></div>
                </div>
                <div class="ship">
                    <span>Ship</span>
                    <div class="icon"></div>
                </div>
                <div class="hit">
                    <span>Hit Ship</span>
                    <div class="icon"></div>
                </div>
                <div class="sunk">
                    <span>Sunk Ship</span>
                    <div class="icon"></div>
                </div>
                <div class="miss">
                    <span>Miss</span>
                    <div class="icon"></div>
                </div>
            </div>
        </div>
        <div class="player-sections">
            <div id="player1Section" class="player-section" data-index="0">
                <div class="banner">
                    <h2 class="player-name">Player 1</h2>
                    <h3 class="ship-count">Ships left: 999</h3>
                </div>
                <div class="player-board"></div>
                <div class="placement-container">
                    <div class="header">
                        <h3>Available Ships</h3>
                        <h3 class="available-ship-count">Ships left: 999</h3>
                    </div>
                    <div class="placement-controls">
                        <div class="misc-controls">
                            <button class="reset-ships" type="button">Reset</button>
                            <button class="finish-placement" type="button">Finish</button>
                        </div>
                        <div class="rotate-controls">
                            <button class="rotate-ship" type="button">Rotate</button>
                            <span class="current-direction"></span>
                        </div>
                    </div>
                    <div class="available-ships"></div>
                </div>
            </div>
            <div class="turn-controls">
                <button type="button" id="finishTurn" disabled>Finish turn</button>
            </div>
            <div id="player2Section" class="player-section" data-index="1">
                <div class="banner">
                    <h2 class="player-name">Player 2</h2>
                    <h3 class="ship-count">Ships left: 999</h3>
                </div>
                <div class="player-board"></div>
                <div class="placement-container">
                    <div class="header">
                        <h3>Available Ships</h3>
                        <h3 class="available-ship-count">Ships left: 999</h3>
                    </div>
                    <div class="placement-controls">
                        <div class="misc-controls">
                            <button class="reset-ships" type="button">Reset</button>
                            <button class="finish-placement" type="button">Finish</button>
                        </div>
                        <div class="rotate-controls">
                            <button class="rotate-ship" type="button">Rotate</button>
                            <span class="current-direction"></span>
                        </div>
                    </div>
                    <div class="available-ships"></div>
                </div>
            </div>
        </div>
    </div>
    <div id="restartGameContainer" style="display: none;">
        <button id="restartGameButton" type="button">Start New Game</button>
    </div>
</body>
</html>
